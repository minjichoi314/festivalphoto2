<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>해솔 네컷</title><link rel="stylesheet" href="./style.css"></head>
<body><main><header><span class="badge">HAESOL / PHOTO BOOTH</span><h1>해솔 네컷</h1><p>우리의 하루를 사진 네 장에 담아요.</p></header>
<section class="layout"><div class="camera"><video id="video" autoplay muted playsinline aria-hidden="true"></video><canvas id="livePreview" width="640" height="360" aria-label="카메라 미리보기"></canvas><div id="countdown" class="countdown" aria-live="assertive"></div><p id="cameraHint">카메라 시작을 눌러 주세요.</p></div>
<div class="panel"><div class="progress" id="progress">0 / 4 촬영</div><canvas id="preview" width="720" height="1080" aria-label="완성된 네컷 사진"></canvas><p id="status" role="status">카메라 사용을 허용하면 촬영할 수 있어요.</p><div class="actions"><button id="start">카메라 시작</button><button id="shoot" disabled>네 장 촬영</button><button id="retry" disabled>다시 찍기</button><button id="download" disabled>사진 저장</button></div><form id="mailForm"><label for="email">사진을 받을 이메일</label><input id="email" name="email" type="email" inputmode="email" autocomplete="off" placeholder="name@example.com" maxlength="254" required><input id="photoData" name="photoData" type="hidden"><button id="send" type="submit" disabled>이메일로 보내기</button></form><p class="notice">이메일 발송 시 사진과 주소가 Google Apps Script로 전달됩니다. 새 탭에서 결과를 확인하고 다음 팀 전에 다시 찍기를 눌러 주세요.</p></div></section></main><script type="module" src="./app.js"></script></body></html>
